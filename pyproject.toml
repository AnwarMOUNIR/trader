[project]
name = "sp500-intraday-research"
version = "0.1.0"
description = "Acquisition, normalization, and validation of historical S&P 500 membership and intraday candles"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "joblib>=1.3.0",
    "requests>=2.31.0",
    "scikit-learn==1.7.2",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "exchange-calendars>=4.5.0",
    "duckdb>=0.10.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "yfinance>=0.2.36",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_research"]

[tool.pytest.ini_options]
pythonpath = ["src"]

