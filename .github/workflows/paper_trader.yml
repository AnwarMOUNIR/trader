name: Multi-Horizon Intraday Paper Trading Cloud Runner

on:
  schedule:
    # Runs every 15 minutes during US trading hours (13:30 to 21:00 UTC, Mon-Fri)
    - cron: '*/15 13-21 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions web UI anytime

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Intraday 5m Paper Trading Loop
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          APCA_API_BASE_URL: 'https://paper-api.alpaca.markets'
        run: |
          python run_live_paper.py --mode live-5m --iterations 3 --interval 5
