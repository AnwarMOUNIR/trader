name: Whale Momentum Paper Trading Cloud Runner

on:
  schedule:
    # Runs at 14:35 UTC (9:35 AM EST) Monday through Friday (right after market open)
    - cron: '35 14 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub web UI anytime

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Quant & Alpaca Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn yfinance alpaca-py python-dotenv

      - name: Execute Daily Paper Trading Cycle
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          APCA_API_BASE_URL: 'https://paper-api.alpaca.markets'
        run: |
          python run_live_paper.py
